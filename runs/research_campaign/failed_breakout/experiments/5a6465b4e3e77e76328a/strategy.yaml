family: failed_breakout
hypothesis: Failed breaks can occasionally lead to extended reversals, so an absolute
  profit cap may reduce their payoff.
timeframe_minutes: 60
entry:
  long:
    all:
    - feature: failed_breakout_down_24
      op: eq
      value: true
    - feature: range_position_24
      op: lt
      value: 0.5
    - &id001
      feature: efficiency_24
      op: lt
      value: 0.25
  short:
    all:
    - feature: failed_breakout_up_24
      op: eq
      value: true
    - feature: range_position_24
      op: gt
      value: 0.5
    - *id001
exit:
  stop_loss_pct: 0.02
  max_holding_bars: 24
  long:
    feature: range_position_24
    op: gte
    value: 0.5
  short:
    feature: range_position_24
    op: lte
    value: 0.5
execution:
  spread_bps: 2
  slippage_bps_per_side: 0.2
  commission_bps_round_trip: 0
  financing_bps_per_day: 0
