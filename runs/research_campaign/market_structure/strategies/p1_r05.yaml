      op: lt
      value: 0
exit:
  stop_loss_pct: 0.02
  max_holding_bars: 36
  long:
    feature: range_position_24
    op: lt
    value: 0.5
  short:
    feature: range_position_24
    op: gt
    value: 0.5
execution:
