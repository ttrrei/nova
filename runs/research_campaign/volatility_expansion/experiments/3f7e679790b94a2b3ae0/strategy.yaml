version: 1
id: volatility_expansion_p1_r04
family: volatility_expansion
hypothesis: One close holding the outer range quarter after a1.5ATR breakout may exclude
  immediate expansion failures.
timeframe_minutes: 60
entry:
  long:
    after_event:
      bars: 1
      event:
        all:
        - feature: breakout_up_24
          op: eq
          value: true
        - feature: range_atr
          op: gt
          value: 1.5
      condition:
        feature: range_position_24
        op: gt
        value: 0.75
  short:
    after_event:
      bars: 1
      event:
        all:
        - feature: breakout_down_24
          op: eq
          value: true
        - feature: range_atr
          op: gt
          value: 1.5
      condition:
        feature: range_position_24
        op: lt
        value: 0.25
exit:
  stop_loss_pct: 0.02
  take_profit_pct: 0.04
  max_holding_bars: 24
  long:
    feature: range_position_24
    op: lt
    value: 0.5
  short:
    feature: range_position_24
    op: gt
    value: 0.5
execution:
  spread_bps: 2
  slippage_bps_per_side: 0.2
  commission_bps_round_trip: 0
  financing_bps_per_day: 0
