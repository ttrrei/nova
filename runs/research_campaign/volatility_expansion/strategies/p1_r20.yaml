version: 1
id: volatility_expansion_p1_r20
family: volatility_expansion
hypothesis: The uncapped18bar expansion rule may work without its above-average activity
  filter, making the simpler price rule preferable if breadth remains.
timeframe_minutes: 60
entry:
  long:
    all:
    - feature: breakout_up_24
      op: eq
      value: true
    - feature: range_atr
      op: gt
      value: 1.5
  short:
    all:
    - feature: breakout_down_24
      op: eq
      value: true
    - feature: range_atr
      op: gt
      value: 1.5
exit:
  stop_loss_pct: 0.02
  max_holding_bars: 18
  long:
    feature: range_position_24
    op: lt
    value: 0.5
  short:
    feature: range_position_24
    op: gt
    value: 0.5
execution:
  spread_bps: 2
  slippage_bps_per_side: 0.2
  commission_bps_round_trip: 0
  financing_bps_per_day: 0
