version: 1
id: trend_continuation_p1_r13
family: trend_continuation
hypothesis: Three-bar persistent PSAR alignment with EMA60 agreement may support repeated
  continuation opportunities without requiring a specific flip age.
timeframe_minutes: 60
entry:
  long:
    all:
    - held_for:
        bars: 3
        condition:
          feature: psar_direction
          op: eq
          value: 1
    - feature: close_ema60_distance_atr
      op: gt
      value: 0
    - feature: efficiency_24
      op: lt
      value: 0.5
  short:
    all:
    - held_for:
        bars: 3
        condition:
          feature: psar_direction
          op: eq
          value: -1
    - feature: close_ema60_distance_atr
      op: lt
      value: 0
    - feature: efficiency_24
      op: lt
      value: 0.5
exit:
  stop_loss_pct: 0.02
  max_holding_bars: 60
  long:
    feature: psar_flip_down
    op: eq
    value: true
  short:
    feature: psar_flip_up
    op: eq
    value: true
execution:
  spread_bps: 2
  slippage_bps_per_side: 0.2
  commission_bps_round_trip: 0
  financing_bps_per_day: 0
