version: 1
id: mean_reversion_p1_r03
family: mean_reversion
hypothesis: Recovery fades are more plausible when the recent24bar path has low directional
  efficiency.
timeframe_minutes: 60
entry:
  long:
    all:
    - all:
      - within:
          bars: 6
          condition:
            feature: close_sma24_distance_atr
            op: lt
            value: -2
      - feature: close_sma24_distance_atr
        op: gt
        value: -1.5
      - feature: close_sma24_distance_atr
        op: lt
        value: 0
    - feature: efficiency_24
      op: lt
      value: 0.25
  short:
    all:
    - all:
      - within:
          bars: 6
          condition:
            feature: close_sma24_distance_atr
            op: gt
            value: 2
      - feature: close_sma24_distance_atr
        op: lt
        value: 1.5
      - feature: close_sma24_distance_atr
        op: gt
        value: 0
    - feature: efficiency_24
      op: lt
      value: 0.25
exit:
  stop_loss_pct: 0.02
  take_profit_pct: 0.01
  max_holding_bars: 12
  long:
    feature: close_sma24_distance_atr
    op: gte
    value: 0
  short:
    feature: close_sma24_distance_atr
    op: lte
    value: 0
execution:
  spread_bps: 2
  slippage_bps_per_side: 0.2
  commission_bps_round_trip: 0
  financing_bps_per_day: 0
