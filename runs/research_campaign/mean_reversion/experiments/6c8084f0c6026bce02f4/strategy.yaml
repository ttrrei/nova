    all:
    - all:
      - within:
          bars: 18
          condition:
            feature: close_sma24_distance_atr
            op: lt
            value: -2.5
      - feature: close_sma24_distance_atr
        op: gt
        value: -1.5
      - feature: close_sma24_distance_atr
        op: lt
        value: 0
    - feature: efficiency_24
      op: lt
      value: 0.25
  short:
    all:
    - all:
      - within:
          bars: 18
          condition:
            feature: close_sma24_distance_atr
            op: gt
            value: 2.5
      - feature: close_sma24_distance_atr
        op: lt
        value: 1.5
      - feature: close_sma24_distance_atr
        op: gt
        value: 0
    - feature: efficiency_24
      op: lt
      value: 0.25
exit:
  stop_loss_pct: 0.02
  max_holding_bars: 24
  long:
    feature: close_sma24_distance_atr
    op: gte
    value: 0
  short:
    feature: close_sma24_distance_atr
    op: lte
    value: 0
execution:
