version: 1
id: directions_pullback_reentry
family: pullback_reentry
hypothesis: RSI recovery after a recent pullback may identify renewed continuation within an established EMA trend.
timeframe_minutes: 60
entry:
  long:
    all:
      - {feature: ema_alignment_6_24, op: eq, value: 1}
      - {feature: close_ema60_distance_atr, op: gt, value: 0}
      - within:
          bars: 6
          condition: {feature: rsi_14, op: lt, value: 45}
      - held_for:
          bars: 2
          condition: {feature: rsi_14, op: gt, value: 50}
  short:
    all:
      - {feature: ema_alignment_6_24, op: eq, value: -1}
      - {feature: close_ema60_distance_atr, op: lt, value: 0}
      - within:
          bars: 6
          condition: {feature: rsi_14, op: gt, value: 55}
      - held_for:
          bars: 2
          condition: {feature: rsi_14, op: lt, value: 50}
exit:
  stop_loss_pct: 0.02
  take_profit_pct: 0.03
  max_holding_bars: 24
  long: {feature: ema_alignment_6_24, op: eq, value: -1}
  short: {feature: ema_alignment_6_24, op: eq, value: 1}
execution:
  spread_bps: 2
  slippage_bps_per_side: 0.2
  commission_bps_round_trip: 0
  financing_bps_per_day: 0
