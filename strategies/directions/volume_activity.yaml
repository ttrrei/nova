version: 1
id: directions_volume_activity
family: volume_activity
hypothesis: A prior-24-bar closing breakout accompanied by quote activity above 1.5 times its prior-24-bar mean may precede continuation; activity is a volume proxy.
timeframe_minutes: 60
entry:
  long:
    all:
      - {feature: breakout_up_24, op: eq, value: true}
      - {feature: relative_volume_24, op: gt, value: 1.5}
  short:
    all:
      - {feature: breakout_down_24, op: eq, value: true}
      - {feature: relative_volume_24, op: gt, value: 1.5}
exit:
  stop_loss_pct: 0.02
  take_profit_pct: 0.03
  max_holding_bars: 24
  long: {feature: range_position_24, op: lt, value: 0.5}
  short: {feature: range_position_24, op: gt, value: 0.5}
execution:
  spread_bps: 2
  slippage_bps_per_side: 0.2
  commission_bps_round_trip: 0
  financing_bps_per_day: 0
