version: 1
id: directions_regime_transition
family: regime_transition
hypothesis: A transition from low to high 24-bar path efficiency may initiate a directional move aligned with EMA and recent price change.
timeframe_minutes: 60
entry:
  long:
    all:
      - within:
          bars: 6
          condition: {feature: efficiency_24, op: lt, value: 0.25}
      - {feature: efficiency_24, op: gt, value: 0.5}
      - {feature: ema_alignment_6_24, op: eq, value: 1}
      - {feature: return_6_atr, op: gt, value: 0}
  short:
    all:
      - within:
          bars: 6
          condition: {feature: efficiency_24, op: lt, value: 0.25}
      - {feature: efficiency_24, op: gt, value: 0.5}
      - {feature: ema_alignment_6_24, op: eq, value: -1}
      - {feature: return_6_atr, op: lt, value: 0}
exit:
  stop_loss_pct: 0.02
  take_profit_pct: 0.03
  max_holding_bars: 24
  long:
    any:
      - {feature: efficiency_24, op: lt, value: 0.25}
      - {feature: ema_alignment_6_24, op: eq, value: -1}
  short:
    any:
      - {feature: efficiency_24, op: lt, value: 0.25}
      - {feature: ema_alignment_6_24, op: eq, value: 1}
execution:
  spread_bps: 2
  slippage_bps_per_side: 0.2
  commission_bps_round_trip: 0
  financing_bps_per_day: 0
