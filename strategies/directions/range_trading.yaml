version: 1
id: directions_range_trading
family: range_trading
hypothesis: In a low-efficiency path, closes inside the outer 15 percent of the prior 24-bar range may revert toward its moving midpoint.
timeframe_minutes: 60
entry:
  long:
    all:
      - {feature: efficiency_24, op: lt, value: 0.25}
      - {feature: range_position_24, op: gte, value: 0}
      - {feature: range_position_24, op: lt, value: 0.15}
  short:
    all:
      - {feature: efficiency_24, op: lt, value: 0.25}
      - {feature: range_position_24, op: gt, value: 0.85}
      - {feature: range_position_24, op: lte, value: 1}
exit:
  stop_loss_pct: 0.02
  take_profit_pct: 0.01
  max_holding_bars: 12
  long: {feature: range_position_24, op: gte, value: 0.5}
  short: {feature: range_position_24, op: lte, value: 0.5}
execution:
  spread_bps: 2
  slippage_bps_per_side: 0.2
  commission_bps_round_trip: 0
  financing_bps_per_day: 0
