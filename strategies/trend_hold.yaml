version: 1
id: trend_hold_demo
family: trend_continuation
timeframe_minutes: 60
entry:
  long:
    after_event:
      bars: 3
      event: {feature: sma_cross_up_6_24, op: eq, value: true}
      condition: {feature: sma_alignment_6_24, op: eq, value: 1}
  short:
    after_event:
      bars: 3
      event: {feature: sma_cross_down_6_24, op: eq, value: true}
      condition: {feature: sma_alignment_6_24, op: eq, value: -1}
exit:
  stop_loss_pct: 0.02
  take_profit_pct: 0.04
  max_holding_bars: 24
  long: {feature: sma_alignment_6_24, op: lt, value: 0}
  short: {feature: sma_alignment_6_24, op: gt, value: 0}
execution:
  spread_bps: 2
  slippage_bps_per_side: 0.2
  commission_bps_round_trip: 0
  financing_bps_per_day: 0
