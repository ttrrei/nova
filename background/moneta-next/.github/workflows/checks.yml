name: Starter checks

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[legacy,ingestion,test]'
      - name: Require DuckDB and run all tests
        run: |
          python -c "import duckdb; print(duckdb.__version__)"
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit('All checks, including optional numerical checks, must execute and pass')
          PY
      - name: Run both YAML examples on synthetic data
        run: |
          python examples/generate_demo.py --days 65
          python -m moneta_next --data data/demo.csv --strategy examples/trend_hold.yaml
          python -m moneta_next --data data/demo.csv --strategy examples/mean_reversion.yaml
