version: 1
id: legacy_psar_confirmation
family: trend_continuation
timeframe_minutes: 60
entry:
  long:
    after_event:
      bars: 3
      event: {feature: psar_flip_up_0p02_0p2, op: eq, value: true}
      condition: {feature: psar_dir_0p02_0p2, op: eq, value: 1}
  short:
    after_event:
      bars: 3
      event: {feature: psar_flip_down_0p02_0p2, op: eq, value: true}
      condition: {feature: psar_dir_0p02_0p2, op: eq, value: -1}
exit:
  stop_loss_pct: 0.02
  max_holding_bars: 24
  long: {feature: psar_dir_0p02_0p2, op: eq, value: -1}
  short: {feature: psar_dir_0p02_0p2, op: eq, value: 1}
execution:
  spread_bps: 2
  slippage_bps_per_side: 0.2
