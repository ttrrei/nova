name: Nova checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: python -m pytest -q
      - run: ruff check src tests scripts --select E4,E7,E9,F
      - run: ruff format --check src tests scripts
      - run: python -m compileall -q src tests scripts
      - run: nova validate strategies/trend_hold.yaml
      - run: nova validate strategies/mean_reversion.yaml
      - run: nova-doctor
